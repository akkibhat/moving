name = "nzmovingsale"
main = "worker/index.js"
compatibility_date = "2026-09-15"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "OFFERS_KV"
id = "759478d5f609460f8e75759c17c57954"

[[kv_namespaces]]
binding = "VISITS_KV"
id = "f1a55f135e304224ba38cf7e9c51e0cd"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "nzmovingsale-images"

# Moving sale closed 2026-10-02. Custom domain route removed below so
# move.pi.co.nz stops serving the site, without deleting the Worker, KV
# offer/visit history, or R2 photos — all still intact for later. To bring
# the site back, restore the commented block and `wrangler deploy` again.
# [[routes]]
# pattern = "move.pi.co.nz"
# custom_domain = true
