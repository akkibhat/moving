<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Moving Sale — Offers (Private)</title>
<style>
  :root {
    --bg: #faf8f4;
    --ink: #1c1b19;
    --muted: #6b6660;
    --card-bg: #ffffff;
    --accent: #b5502c;
    --accent-soft: #f2e2da;
    --line: #e7e2d9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 40px 24px 80px; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 0.9rem; }
  .gate {
    max-width: 360px;
    margin: 80px auto;
    padding: 28px;
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 14px;
    text-align: center;
  }
  .gate input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 1rem;
    margin: 14px 0;
  }
  .gate button, .refresh-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .gate .error { color: var(--accent); font-size: 0.85rem; min-height: 1.2em; }
  [hidden] { display: none !important; }
  .item-group {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-bottom: 18px;
    overflow: hidden;
  }
  .item-header {
    background: var(--accent-soft);
    padding: 12px 16px;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .item-count { font-weight: 400; color: var(--muted); font-size: 0.85rem; }
  .listed-price { font-weight: 400; color: var(--muted); font-size: 0.85rem; }
  .status-section-heading {
    font-size: 1.1rem;
    margin: 28px 0 12px;
    color: var(--accent);
  }
  .status-section-heading:first-child { margin-top: 0; }
  .offer-row {
    padding: 12px 16px;
    border-top: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 4px 16px;
    align-items: baseline;
  }
  .offer-row.winner { background: var(--ok-bg, #eef4ec); }
  .winner-badge {
    flex-basis: 100%;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #3d5c37;
  }
  .winner-note {
    flex-basis: 100%;
    font-size: 0.85rem;
    font-style: italic;
    color: #3d5c37;
    margin-top: 2px;
  }
  .offer-row .name { font-weight: 600; }
  .offer-row .amount { color: var(--accent); font-weight: 700; }
  .amount-vs-listed { color: var(--muted); font-weight: 400; font-size: 0.8rem; }
  .offer-row .meta { color: var(--muted); font-size: 0.82rem; }
  .offer-row .message { flex-basis: 100%; font-size: 0.88rem; color: #45413c; margin-top: 2px; }
  .badge {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--line);
    color: var(--muted);
  }
  .badge.web { background: #eef4ec; color: #3d5c37; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab-btn {
    background: var(--card-bg);
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  table.visits { width: 100%; border-collapse: collapse; background: var(--card-bg); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font-size: 0.85rem; }
  table.visits th, table.visits td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  table.visits th { background: var(--accent-soft); font-weight: 700; }
  table.visits tr:last-child td { border-bottom: none; }
  .visits-wrap { overflow-x: auto; }
</style>
</head>
<body>

<div class="gate" id="gate">
  <h1 style="font-size:1.2rem;">Private — offers log</h1>
  <p class="sub" style="margin-bottom:0;">Enter the password to view.</p>
  <form onsubmit="event.preventDefault(); unlock();">
    <input type="password" id="passwordInput" placeholder="Password" autocomplete="off">
    <div class="error" id="gateError"></div>
    <button type="submit">Unlock</button>
  </form>
</div>

<div class="wrap" id="content" hidden>
  <div class="toolbar">
    <div>
      <h1 id="pageTitle">Offers on your listings</h1>
      <p class="sub" id="pageSub">Combines real offers from the website form with anything you've added manually (Geekzone, private messages).</p>
    </div>
    <button class="refresh-btn" onclick="refreshCurrentTab()">Refresh</button>
  </div>
  <div class="tabs">
    <button class="tab-btn active" id="tabOffersBtn" onclick="switchTab('offers')">Offers</button>
    <button class="tab-btn" id="tabVisitsBtn" onclick="switchTab('visits')">Page Views</button>
  </div>
  <div id="groups"></div>
  <div id="visitsWrap" hidden></div>
</div>

<script>
const STORAGE_KEY = 'movingsale-admin-password';

function unlock() {
  const pw = document.getElementById('passwordInput').value;
  sessionStorage.setItem(STORAGE_KEY, pw);
  loadOffers();
}

let currentTab = 'offers';

async function loadOffers() {
  const pw = sessionStorage.getItem(STORAGE_KEY);
  if (!pw) return;

  const res = await fetch('/api/offers', {
    headers: { 'X-Admin-Password': pw },
  });

  if (res.status === 401) {
    sessionStorage.removeItem(STORAGE_KEY);
    document.getElementById('gate').hidden = false;
    document.getElementById('content').hidden = true;
    document.getElementById('gateError').textContent = 'Wrong password.';
    return;
  }

  document.getElementById('gate').hidden = true;
  document.getElementById('content').hidden = false;

  const offers = await res.json();
  renderGroups(offers);
}

async function loadVisits() {
  const pw = sessionStorage.getItem(STORAGE_KEY);
  if (!pw) return;

  const res = await fetch('/api/visits', {
    headers: { 'X-Admin-Password': pw },
  });

  if (res.status === 401) {
    sessionStorage.removeItem(STORAGE_KEY);
    document.getElementById('gate').hidden = false;
    document.getElementById('content').hidden = true;
    document.getElementById('gateError').textContent = 'Wrong password.';
    return;
  }

  document.getElementById('gate').hidden = true;
  document.getElementById('content').hidden = false;

  const visits = await res.json();
  renderVisits(visits);
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabOffersBtn').classList.toggle('active', tab === 'offers');
  document.getElementById('tabVisitsBtn').classList.toggle('active', tab === 'visits');
  document.getElementById('groups').hidden = tab !== 'offers';
  document.getElementById('visitsWrap').hidden = tab !== 'visits';

  if (tab === 'offers') {
    document.getElementById('pageTitle').textContent = 'Offers on your listings';
    document.getElementById('pageSub').textContent = "Combines real offers from the website form with anything you've added manually (Geekzone, private messages).";
    loadOffers();
  } else {
    document.getElementById('pageTitle').textContent = 'Page views';
    document.getElementById('pageSub').textContent = 'Most recent 500 visits to the public listing page (kept for 90 days).';
    loadVisits();
  }
}

function refreshCurrentTab() {
  if (currentTab === 'offers') loadOffers();
  else loadVisits();
}

function renderVisits(visits) {
  const wrap = document.getElementById('visitsWrap');
  wrap.innerHTML = '';

  if (!visits.length) {
    wrap.innerHTML = '<div class="empty">No page views logged yet.</div>';
    return;
  }

  const cols = [
    ['date', 'When'],
    ['ip', 'IP'],
    ['city', 'City'],
    ['region', 'Region'],
    ['country', 'Country'],
    ['postalCode', 'Postcode'],
    ['timezone', 'Timezone'],
    ['latitude', 'Lat'],
    ['longitude', 'Lng'],
    ['asOrganization', 'ISP'],
    ['asn', 'ASN'],
    ['colo', 'CF Datacenter'],
    ['httpProtocol', 'HTTP'],
    ['tlsVersion', 'TLS'],
    ['clientTcpRtt', 'RTT (ms)'],
    ['acceptLanguage', 'Language'],
    ['referrer', 'Referrer'],
    ['userAgent', 'User Agent'],
  ];

  const table = document.createElement('table');
  table.className = 'visits';

  const thead = document.createElement('thead');
  thead.innerHTML = `<tr>${cols.map(([, label]) => `<th>${escapeHtml(label)}</th>`).join('')}</tr>`;
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  visits.forEach((v) => {
    const tr = document.createElement('tr');
    tr.innerHTML = cols
      .map(([key]) => {
        let val = v[key];
        if (key === 'date' && val) {
          val = new Date(val).toLocaleString('en-NZ', { dateStyle: 'medium', timeStyle: 'short' });
        }
        return `<td title="${escapeHtml(String(val ?? ''))}">${escapeHtml(String(val ?? ''))}</td>`;
      })
      .join('');
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);

  const container = document.createElement('div');
  container.className = 'visits-wrap';
  container.appendChild(table);
  wrap.appendChild(container);
}

// Sections shown in this order; each only renders if it has items.
const STATUS_SECTIONS = ['Pending Sale', 'Sold', 'Available'];

function renderGroups(offers) {
  const container = document.getElementById('groups');
  container.innerHTML = '';

  if (!offers.length) {
    container.innerHTML = '<div class="empty">No offers yet.</div>';
    return;
  }

  const byItem = {};
  offers.forEach((o) => {
    if (!byItem[o.item]) byItem[o.item] = [];
    byItem[o.item].push(o);
  });

  const itemNames = Object.keys(byItem);

  // Group items by their current status (Pending Sale / Sold / Available)
  // so the log reads as "what needs action" vs "already done" at a glance,
  // while every individual offer for an item still stays together underneath.
  STATUS_SECTIONS.forEach((status) => {
    const namesInSection = itemNames
      .filter((item) => (byItem[item][0].itemStatus || 'Available') === status)
      .sort((a, b) => new Date(byItem[b][0].date || 0) - new Date(byItem[a][0].date || 0));

    if (!namesInSection.length) return;

    const sectionHeading = document.createElement('h2');
    sectionHeading.className = 'status-section-heading';
    sectionHeading.textContent = status;
    container.appendChild(sectionHeading);

    namesInSection.forEach((item) => {
      container.appendChild(renderItemGroup(item, byItem[item]));
    });
  });
}

function renderItemGroup(item, offersForItem) {
  const group = document.createElement('div');
  group.className = 'item-group';

  const header = document.createElement('div');
  header.className = 'item-header';
  const listedPrice = offersForItem[0].listedPrice;
  header.innerHTML = `<span>${escapeHtml(item)}${listedPrice ? ` <span class="listed-price">(listed at ${escapeHtml(listedPrice)})</span>` : ''}</span><span class="item-count">${offersForItem.length} offer${offersForItem.length === 1 ? '' : 's'}</span>`;
  group.appendChild(header);

  offersForItem.forEach((o) => {
    const row = document.createElement('div');
    row.className = 'offer-row' + (o.winner ? ' winner' : '');
    const dateStr = o.date ? new Date(o.date).toLocaleString('en-NZ', { dateStyle: 'medium', timeStyle: 'short' }) : '';
    const badgeClass = o.source === 'Website form' ? 'badge web' : 'badge';
    row.innerHTML = `
      ${o.winner ? '<span class="winner-badge">✓ Selected</span>' : ''}
      <span class="name">${escapeHtml(o.name || '(no name)')}</span>
      ${o.email ? `<span class="meta">${escapeHtml(o.email)}</span>` : ''}
      ${o.offerAmount ? `<span class="amount">${escapeHtml(o.offerAmount)}${o.listedPrice ? ` <span class="amount-vs-listed">(listed ${escapeHtml(o.listedPrice)})</span>` : ''}</span>` : ''}
      <span class="${badgeClass}">${escapeHtml(o.source)}</span>
      <span class="meta">${dateStr}</span>
      ${o.message ? `<span class="message">${escapeHtml(o.message)}</span>` : ''}
      ${o.winnerNote ? `<span class="winner-note">${escapeHtml(o.winnerNote)}</span>` : ''}
    `;
    group.appendChild(row);
  });

  return group;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// If a password is already stashed for this browser session, skip the gate.
if (sessionStorage.getItem(STORAGE_KEY)) {
  loadOffers();
}
</script>
</body>
</html>
